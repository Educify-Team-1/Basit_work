apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-api
  namespace: matching-system
  labels:
    app: matching-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: matching-api
  template:
    metadata:
      labels:
        app: matching-api
    spec:
      containers:
      - name: matching-api
        image: matching-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: matching-config
              key: redis_url
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: matching-config
              key: postgres_url
        - name: MLFLOW_TRACKING_URI
          valueFrom:
            configMapKeyRef:
              name: matching-config
              key: mlflow_url
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: model-storage
          mountPath: /app/models
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: matching-api-service
  namespace: matching-system
spec:
  selector:
    app: matching-api
  ports:
  - port: 80
    targetPort: 8000
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-pvc
  namespace: matching-system
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
