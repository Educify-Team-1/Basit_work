services:
  matching-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATABASE_URL=postgresql://user:${DB_PASSWORD}@postgres:5432/matching_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mlflow:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./data:/app/data  
    restart: unless-stopped

  training-service:
    build:
      context: .
      dockerfile: Dockerfile.training
    environment:
      - REDIS_URL=redis://redis:6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATABASE_URL=postgresql://user:${DB_PASSWORD}@postgres:5432/matching_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mlflow:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: python training.py
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=matching_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d matching_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mlflow:
    image: python:3.11-slim
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=postgresql://user:${DB_PASSWORD}@postgres:5432/matching_db
      - DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command: |
      bash -c "
        apt-get update && apt-get install -y gcc &&
        pip install mlflow==2.8.1 psycopg2-binary &&
        mlflow server --backend-store-uri postgresql://user:${DB_PASSWORD}@postgres:5432/matching_db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
      "
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    
volumes:
  redis_data:
  postgres_data:
  mlflow_artifacts: