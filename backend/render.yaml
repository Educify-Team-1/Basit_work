services:
  - type: web
    name: educify-backend
    env: python
    plan: free
    region: frankfurt  # or oregon, depending on your audience
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    runtime: python
    pythonVersion: 3.11.9
    rootDir: backend
    autoDeploy: true
